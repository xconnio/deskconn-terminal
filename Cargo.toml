[package]
name = "deskconn-terminal"
version = "0.3.0"
description = "Standalone terminal for your DeskConn machines"
authors = ["XConnIO <info@xconn.io>"]
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ghostty-vt = "0.9.0"
anyhow = "1"
base64 = "0.22"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v0.233.10" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v0.233.10", features = ["wayland", "x11", "font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "time", "macros"] }
xconn = { version = "0.6.8", default-features = false, features = ["async", "yamux", "rpc-streams"] }
xconn-crypto = "0.6.8"
zeroize = "1"

# zed-async-tar (through GPUI) needs xattr 0.2, which no longer builds with current libc.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# Smaller and a little faster, for slower builds.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
