name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to a pull request supersedes its runs in progress; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libzstd-dev

      # Builds libghostty-vt, for which Ghostty has no prebuilt library on Linux.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # Lints, tests and the build all run in release mode, to share what they compile.
      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: |
          cargo build --locked --release
          mkdir dist
          cp target/release/deskconn-terminal dist/deskconn-terminal-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: deskconn-terminal-linux
          retention-days: 90
          path: dist/*

  # The code is the same on macOS, whose minutes cost ten times Linux's: it's only built there,
  # while formatting, lints and tests run on Linux.
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --locked --release
          mkdir dist
          cp target/release/deskconn-terminal dist/deskconn-terminal-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: deskconn-terminal-macos
          retention-days: 90
          path: dist/*

  # Releases Cargo.toml's version once it lands on main without a tag yet, i.e.
  # after merging a "Prepare release" pull request (or any other version bump).
  release:
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check for an unreleased version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.version
        uses: actions/download-artifact@v4
        with:
          pattern: deskconn-terminal-*
          path: release
          merge-multiple: true

      - name: Publish release
        if: steps.version.outputs.version
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum * > SHA256SUMS
          gh release create "v$VERSION" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeskConn Terminal v$VERSION" --generate-notes
