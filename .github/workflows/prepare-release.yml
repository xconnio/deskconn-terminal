name: Prepare release

# Opens a PR that bumps package.json to the given version. Merging it releases
# that version (see the release job in main.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version, without v (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Open the release pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released" >&2; exit 1
          fi
          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "$branch already exists; review its pull request instead" >&2; exit 1
          fi

          # package.json and package-lock.json; fails if it's already this version.
          npm version "$VERSION" --no-git-tag-version

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898583+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Release $VERSION" \
            --body "Bumps the app to $VERSION. Merging this builds the installers and publishes the v$VERSION GitHub release."
